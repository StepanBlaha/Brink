name: Deploy website

on:
  push:
    branches: [main]
    paths: ["website/**", "legal/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build static site
        working-directory: website
        env:
          # Custom domain: the site is served from the root, so no base path.
          NEXT_PUBLIC_SITE_URL: https://brinknotch.site
        run: |
          npm ci
          npm run build
      - name: Publish website/out to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/out
          force_orphan: true
          cname: brinknotch.site
