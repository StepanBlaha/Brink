name: windows

on:
  push:
    paths: ["windows/**", ".github/workflows/windows.yml", "VERSION"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml", "VERSION"]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: cargo fmt
        run: cargo fmt --check
        working-directory: windows/src-tauri
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: windows/src-tauri
      - name: cargo test
        run: cargo test
        working-directory: windows/src-tauri

      - name: Build NSIS installer (unsigned)
        run: npm run tauri build -- --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: brink-windows-nsis
          path: windows/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
